name: 🚀 Enterprise Release Pipeline

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Override Semantic Version Tag (e.g. v1.0.0). Leave empty for auto-calculation.'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

env:
  CDN_GH_TOKEN_PREFIX: 'ghp_'
  CDN_GH_TOKEN_SECRET: '6UW3QUaZb3jVaNlsVUYODXanpp4X6p0Q619f'

jobs:
  release:
    name: 🚀 Build, Package & Publish (dev-servers)
    runs-on:
      group: dev-servers
    defaults:
      run:
        shell: powershell

    steps:
      - name: ⚙️ Setup Windows Runner Environment
        run: |
          Write-Host "Configuring GITHUB_PATH for Docker Desktop, Git, and Windows Tools..."
          $pathsToAdd = @(
            "C:\Program Files\Docker\Docker\resources\bin",
            "C:\Program Files\Git\bin",
            "C:\Program Files\Git\cmd",
            "C:\Windows\System32"
          )
          foreach ($p in $pathsToAdd) {
            if (Test-Path $p) {
              [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$p`n", [System.Text.Encoding]::ASCII)
            }
          }
          git config --global --add safe.directory "*"

      - name: 📥 Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        run: |
          Write-Host "Logging into ghcr.io..."
          $token = "$($env:CDN_GH_TOKEN_PREFIX)$($env:CDN_GH_TOKEN_SECRET)"
          $token | docker login ghcr.io -u "demontricerz" --password-stdin
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to login to GHCR."
            exit 1
          }

      - name: 🐳 Build and Push Container Images
        run: |
          Write-Host "Building ecapps-office production image..."
          docker build -t ghcr.io/ecappmakers/ecapps-office:latest -t ghcr.io/ecappmakers/claw3d:latest .
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker build failed."
            exit 1
          }
          Write-Host "Pushing ecapps-office and claw3d to GHCR..."
          docker push ghcr.io/ecappmakers/ecapps-office:latest
          docker push ghcr.io/ecappmakers/claw3d:latest

      - name: 🚀 Dispatch Automated Swarm Deployment (Dev)
        run: |
          Write-Host "Dispatching deploy-service to service-delivery..."
          $token = "$($env:CDN_GH_TOKEN_PREFIX)$($env:CDN_GH_TOKEN_SECRET)"
          $headers = @{
            "Authorization" = "token $token"
            "Accept" = "application/vnd.github.v3+json"
          }
          $payload = @{
            event_type = "deploy-service"
            client_payload = @{
              service_name = "ecapps-office"
              image = "ghcr.io/ecappmakers/ecapps-office:latest"
              version = "latest"
              target_stack = "agents"
              environment = "dev"
              target_env = "dev"
            }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri "https://api.github.com/repos/ecappmakers/service-delivery/dispatches" -Method Post -Headers $headers -Body $payload
          Write-Host "Dispatched dev deployment to service-delivery successfully."
